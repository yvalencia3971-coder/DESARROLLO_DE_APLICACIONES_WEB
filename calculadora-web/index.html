
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Calculadora Web</title>

    <!-- Conexión con el archivo CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="contenedor">
        <div class="calculadora">

            <!-- Título -->
            <h1>Calculadora</h1>
            <p class="subtitulo">Realiza tus operaciones matemáticas</p>

            <!-- Pantalla de la calculadora -->
            <input
                type="text"
                id="pantalla"
                class="pantalla"
                value="0"
                readonly
                aria-label="Resultado de la operación"
            >

            <!-- Botones -->
            <div class="botones">

                <button class="especial" onclick="limpiar()">C</button>
                <button class="especial" onclick="borrar()">DEL</button>
                <button class="operador" onclick="agregar('/')">÷</button>
                <button class="operador" onclick="agregar('*')">×</button>

                <button onclick="agregar('7')">7</button>
                <button onclick="agregar('8')">8</button>
                <button onclick="agregar('9')">9</button>
                <button class="operador" onclick="agregar('-')">−</button>

                <button onclick="agregar('4')">4</button>
                <button onclick="agregar('5')">5</button>
                <button onclick="agregar('6')">6</button>
                <button class="operador" onclick="agregar('+')">+</button>

                <button onclick="agregar('1')">1</button>
                <button onclick="agregar('2')">2</button>
                <button onclick="agregar('3')">3</button>
                <button class="igual" onclick="calcular()">=</button>

                <button class="cero" onclick="agregar('0')">0</button>
                <button onclick="agregar('.')">.</button>

            </div>

            <!-- Pie de página -->
            <p class="pie">Proyecto académico - Desarrollo Web</p>

        </div>
    </main>

    <!-- Conexión con el archivo JavaScript -->
    <script src="script.js"></script>

</body>
</html>
